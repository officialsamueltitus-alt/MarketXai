<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" 
          values="#06B6D4;#6366F1;#A855F7;#EC4899;#F59E0B;#10B981;#06B6D4" 
          dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" 
          values="#8B5CF6;#EC4899;#3B82F6;#10B981;#F59E0B;#06B6D4;#8B5CF6" 
          dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Rounded Container with Subtle Border -->
  <rect width="64" height="64" rx="16" fill="#020617" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#xGrad)" stroke-width="1.5" opacity="0.75" />
  <!-- Stylized Geometric "X" with glowing color transitions -->
  <path d="M16 16 L27.5 32 L16 48 L22.5 48 L32 34.5 L41.5 48 L48 48 L36.5 32 L48 16 L41.5 16 L32 29.5 L22.5 16 Z" 
        fill="url(#xGrad)" 
        filter="url(#glow)" />
</svg>
