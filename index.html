    <!-- Twitter Card Metadata -->

    <meta name="twitter:description" content="AI-powered real-time financial market analyzer utilizing institutional liquidity zones and mathematical golden ratio confluence to identify high-probability trading opportunities with optimal entries, stop loss, and take profits." />

    <!-- Browser & Platform UI Theme -->
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon with 'X' and dynamic changing colors -->
    <link rel="icon" id="dynamic-favicon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Web Fonts & Preconnects -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://api.binance.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font load: a slow/blocked Google Fonts request must never keep the page blank -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Paystack Inline Checkout JS (Deferred for zero render-blocking) -->
    <script defer src="https://js.paystack.co/v1/inline.js"></script>

    <!-- Schema.org JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MarketX",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "description": "AI-powered real-time financial market analyzer utilizing institutional liquidity order blocks and mathematical golden ratio confluence.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Dynamic Favicon "X" color cycling across all browsers -->
    <script>
      (function() {
        const colorPairs = [
          ['#06B6D4', '#6366F1'], // Cyan to Indigo
          ['#6366F1', '#A855F7'], // Indigo to Violet
          ['#EC4899', '#8B5CF6'], // Pink to Purple
          ['#F59E0B', '#EF4444'], // Amber to Red
          ['#10B981', '#06B6D4'], // Emerald to Cyan
          ['#38BDF8', '#818CF8']  // Sky to Indigo
        ];
        let colorIndex = 0;

        function updateFaviconColor() {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            // Background container
            ctx.fillStyle = '#020617';
            ctx.beginPath();
            ctx.roundRect(0, 0, 64, 64, 16);
            ctx.fill();

            // Gradient for X
            const colors = colorPairs[colorIndex];
            const grad = ctx.createLinearGradient(0, 0, 64, 64);
            grad.addColorStop(0, colors[0]);
            grad.addColorStop(1, colors[1]);

            // Subtle border
            ctx.strokeStyle = colors[0];
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.roundRect(2, 2, 60, 60, 14);
            ctx.stroke();

            // Draw "X"
            ctx.globalAlpha = 1;
            ctx.fillStyle = grad;
            ctx.beginPath();
            // Path of stylized X
            ctx.moveTo(16, 16);
            ctx.lineTo(27.5, 32);
            ctx.lineTo(16, 48);
            ctx.lineTo(22.5, 48);
            ctx.lineTo(32, 34.5);
            ctx.lineTo(41.5, 48);
            ctx.lineTo(48, 48);
            ctx.lineTo(36.5, 32);
            ctx.lineTo(48, 16);
            ctx.lineTo(41.5, 16);
            ctx.lineTo(32, 29.5);
            ctx.lineTo(22.5, 16);
            ctx.closePath();
            ctx.fill();

            const faviconLink = document.getElementById('dynamic-favicon');
            if (faviconLink) {
              faviconLink.href = canvas.toDataURL('image/png');
            }

            colorIndex = (colorIndex + 1) % colorPairs.length;
          } catch(e) {}
        }

        // Generate once immediately
        updateFaviconColor();

        // On desktop devices only, cycle occasionally if page is visible
        if (window.matchMedia && window.matchMedia('(min-width: 1024px)').matches) {
          setInterval(function() {
            if (!document.hidden) {
              updateFaviconColor();
            }
          }, 15000);
        }
      })();
    </script>
  </head>
  <body class="bg-black bg-[#000000] text-slate-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <!-- Boot watchdog: if the app script fails to load or run (old browser, network, crash), show a message instead of a blank page -->
    <script>
      (function () {
        var shown = false;
        function showFallback(detail) {
          var root = document.getElementById('root');
          if (shown || !root || root.children.length > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#020617;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center">' +
            '<div style="max-width:420px"><h1 style="font-size:20px;font-weight:700;margin:0 0 8px">MarketX could not load</h1>' +
            '<p style="font-size:14px;color:#94a3b8;margin:0 0 16px">Please check your connection and reload. If it keeps happening, update your browser.</p>' +
            '<button onclick="location.reload()" style="padding:10px 18px;border-radius:12px;background:#4f46e5;color:#fff;font-weight:600;border:0">Reload</button>' +
            (detail ? '<p style="font-size:11px;color:#64748b;margin-top:16px;word-break:break-word">' + String(detail).replace(/</g, '&lt;') + '</p>' : '') +
            '</div></div>';
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          var ownScriptFailed = t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf(location.host) !== -1;
          var runtimeError = !t || t === window;
          if (!ownScriptFailed && !runtimeError) return; // ignore third-party resources (fonts, Paystack, images)
          var detail = runtimeError ? e.message : 'Failed to load ' + t.src;
          setTimeout(function () { showFallback(detail); }, 1500);
        }, true);
        setTimeout(function () { showFallback('Timed out while loading.'); }, 15000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
