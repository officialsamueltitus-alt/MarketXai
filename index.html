<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/boot/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS Safari: don't turn prices into tappable phone numbers / links -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    
    <!-- Primary SEO Metadata -->
    <title>MarketX</title>
    <meta name="title" content="MarketX" />
    <meta name="description" content="Super Intelligence (SI) powered real-time market analyst that turns live prices into clear trade plans with entries, stop losses and targets with optimal entries, stop loss, and take profits." />

    <meta name="author" content="MarketX Intelligence" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://marketx.world" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marketx.world" />
    <meta property="og:title" content="MarketX" />
    <meta property="og:description" content="Super Intelligence (SI) powered real-time market analyst that turns live prices into clear trade plans with entries, stop losses and targets with optimal entries, stop loss, and take profits." />
    <meta property="og:site_name" content="MarketX" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="MarketX" />
    <meta name="twitter:description" content="Super Intelligence (SI) powered real-time market analyst that turns live prices into clear trade plans with entries, stop losses and targets with optimal entries, stop loss, and take profits." />

    <!-- Browser & Platform UI Theme -->
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="msapplication-TileImage" content="/brand/marketx-logo-256.png?v=3" />
    <meta property="og:image" content="https://marketx.world/brand/marketx-og-1200x630.jpg?v=4" />

    <!-- Web Fonts & Preconnects -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font load: a slow/blocked Google Fonts request must never keep the page blank -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet" media="print" id="mx-fonts">
    <script src="/boot/fonts.js"></script>
    
    <!-- Paystack checkout script is loaded on demand when the Plans window opens -->

  <body class="bg-black bg-[#000000] text-slate-100 antialiased overflow-hidden select-none">

    <script src="/boot/watchdog.js"></script>
    <script type="module" src="./src/main.tsx"></script>
