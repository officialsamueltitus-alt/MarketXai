<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply the saved theme before first paint (no flash)
      (function () {
        try {
          var p = localStorage.getItem('mx_theme') || 'dark';
          var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Metadata -->
    <title>MarketX</title>
    <meta name="title" content="MarketX" />
    <meta name="description" content="AI-powered real-time market analyst that turns live prices into clear trade plans with entries, stop losses and targets with optimal entries, stop loss, and take profits." />
    <meta name="keywords" content="MarketX, AI trading, crypto analysis, stock market predictions, forex signals, gold, synthetic indices, trade plans, real-time market data" />
    <meta name="author" content="MarketX Intelligence" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://marketx.world" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marketx.world" />
    <meta property="og:title" content="MarketX" />
    <meta property="og:description" content="AI-powered real-time market analyst that turns live prices into clear trade plans with entries, stop losses and targets with optimal entries, stop loss, and take profits." />
    <meta property="og:site_name" content="MarketX" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://marketx.world" />
    <meta name="twitter:title" content="MarketX" />
    <meta name="twitter:description" content="AI-powered real-time market analyst that turns live prices into clear trade plans with entries, stop losses and targets with optimal entries, stop loss, and take profits." />

    <!-- Browser & Platform UI Theme -->
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- MarketX brand icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/marketx-logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/marketx-logo-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta property="og:image" content="https://marketx.world/brand/marketx-logo-512.png" />

    <!-- Web Fonts & Preconnects -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://api.binance.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font load: a slow/blocked Google Fonts request must never keep the page blank -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Paystack Inline Checkout JS (Deferred for zero render-blocking) -->
    <script defer src="https://js.paystack.co/v1/inline.js"></script>

    <!-- Schema.org JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MarketX",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "description": "AI-powered real-time market analyst that turns live prices into clear trade plans.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

  </head>
  <body class="bg-black bg-[#000000] text-slate-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <!-- Boot watchdog: if the app script fails to load or run (old browser, network, crash), show a message instead of a blank page -->
    <script>
      (function () {
        var shown = false;
        function showFallback(detail) {
          var root = document.getElementById('root');
          if (shown || !root || root.children.length > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#09090b;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center">' +
            '<div style="max-width:420px"><h1 style="font-size:20px;font-weight:700;margin:0 0 8px">MarketX could not load</h1>' +
            '<p style="font-size:14px;color:#94a3b8;margin:0 0 16px">Please check your connection and reload. If it keeps happening, update your browser.</p>' +
            '<button onclick="location.reload()" style="padding:10px 18px;border-radius:12px;background:#4f46e5;color:#fff;font-weight:600;border:0">Reload</button>' +
            (detail ? '<p style="font-size:11px;color:#64748b;margin-top:16px;word-break:break-word">' + String(detail).replace(/</g, '&lt;') + '</p>' : '') +
            '</div></div>';
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          var ownScriptFailed = t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf(location.host) !== -1;
          var runtimeError = !t || t === window;
          if (!ownScriptFailed && !runtimeError) return; // ignore third-party resources (fonts, Paystack, images)
          var detail = runtimeError ? e.message : 'Failed to load ' + t.src;
          setTimeout(function () { showFallback(detail); }, 1500);
        }, true);
        setTimeout(function () { showFallback('Timed out while loading.'); }, 15000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
